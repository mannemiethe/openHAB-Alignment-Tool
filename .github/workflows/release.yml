name: Release VS Code Extension

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to release, for example v2.2.0'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Build VSIX and create GitHub Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --include=dev

      - name: Compile extension
        run: npm run compile

      - name: Package VSIX
        run: npx --yes @vscode/vsce package --no-dependencies

      - name: Read package metadata
        id: package
        shell: bash
        run: |
          echo "name=$(node -p "require('./package.json').name")" >> "$GITHUB_OUTPUT"
          echo "display_name=$(node -p "require('./package.json').displayName")" >> "$GITHUB_OUTPUT"
          echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: ${{ steps.package.outputs.display_name }} v${{ steps.package.outputs.version }}
          body: |
            Automated release for ${{ steps.package.outputs.display_name }} v${{ steps.package.outputs.version }}.

            Built from `${{ github.sha }}`.
          files: |
            ${{ steps.package.outputs.name }}-${{ steps.package.outputs.version }}.vsix
